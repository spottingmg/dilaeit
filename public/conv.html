<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>dilaeit · Transit Konverter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="icon" type="image/png" href="/icons/icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap');
        * { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        body { background: #0a0a0a; color: #e5e7eb; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 2px; }

        #drop-zone {
            border: 2px dashed #374151;
            border-radius: 16px;
            padding: 4rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all .2s;
            background: #111;
        }
        #drop-zone.drag-over { border-color: #ef4444; background: #1a0a0a; }
        #drop-zone:hover { border-color: #4b5563; }

        .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; }
        .badge-train  { background: #1e3a5f; color: #93c5fd; }
        .badge-bus    { background: #14532d; color: #86efac; }
        .badge-subway { background: #2e1065; color: #c4b5fd; }
        .badge-tram   { background: #451a03; color: #fcd34d; }
        .badge-ferry  { background: #164e63; color: #67e8f9; }
        .badge-other  { background: #1f2937; color: #9ca3af; }

        .scard { background: #111; border: 1px solid #1f2937; border-radius: 14px; padding: 16px 20px; flex: 1; min-width: 120px; }
        .results-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .results-table th { text-align: left; padding: 10px 12px; color: #6b7280; font-weight: 600; font-size: 11px; text-transform: uppercase; border-bottom: 1px solid #1f2937; white-space: nowrap; }
        .results-table td { padding: 9px 12px; border-bottom: 1px solid #111827; color: #e5e7eb; }
        .step-num { width: 28px; height: 28px; border-radius: 50%; background: #ef4444; color: white; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
    </style>
</head>
<body class="dark min-h-screen">

<header class="sticky top-0 z-50 border-b border-zinc-900 bg-black/80 backdrop-blur-sm">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
        <a href="/" class="flex items-center gap-3 hover:opacity-80 transition-opacity">
            <span class="text-red-600 font-black text-xl italic tracking-tight">dilaeit</span>
            <span class="text-zinc-600 text-xs mono" id="mode-label">/ konverter</span>
        </a>
        <a href="/stats.html" class="text-zinc-500 hover:text-zinc-300 px-2 py-2 rounded-lg hover:bg-zinc-900 transition-colors text-sm">
            <i class="fas fa-chart-bar"></i>
        </a>
    </div>
</header>

<main class="max-w-4xl mx-auto px-4 py-10">
    <div class="mb-10">
        <h1 class="text-3xl font-black tracking-tight mb-2">
            <span id="source-name" class="text-zinc-300">Transit</span>
            <span class="text-zinc-600 mx-3">→</span>
            <span class="text-red-600 italic">dilaeit</span>
        </h1>
        <p class="text-zinc-400 text-sm max-w-lg" id="mode-desc">
            Konvertiere deinen Export ins dilaeit-Format.
        </p>
    </div>

    <div id="drop-zone" onclick="document.getElementById('file-input').click()">
        <input type="file" id="file-input" accept=".json,.txt" class="hidden">
        <div class="text-5xl mb-4 text-zinc-600"><i class="fas fa-file-import"></i></div>
        <p class="text-zinc-300 font-semibold text-lg mb-1">Export JSON/TXT hier ablegen</p>
        <p class="text-zinc-600 text-sm">oder klicken zum Auswählen</p>
    </div>

    <div id="result-section" class="hidden mt-8">
        <div class="flex flex-wrap gap-3 mb-6" id="stat-row"></div>
        <div class="flex items-center justify-between mb-3 flex-wrap gap-4">
            <p class="text-zinc-500 text-sm" id="preview-hint"></p>
            <button onclick="startDownload()" class="bg-red-600 hover:bg-red-700 text-white font-bold text-sm px-6 py-3 rounded-xl shadow-lg shadow-red-600/20 transition-all active:scale-95">
                <i class="fas fa-download mr-2"></i>dilaeit JSON herunterladen
            </button>
        </div>
        <div class="border border-zinc-800 rounded-2xl overflow-hidden bg-zinc-900/30">
            <div style="max-height: 500px; overflow-y: auto;">
                <table class="results-table">
                    <thead class="sticky top-0 bg-zinc-950 z-20">
                        <tr>
                            <th>Datum</th><th>Zeit</th><th>Linie</th><th>Von</th><th>Nach</th><th>km</th><th>Versp.</th>
                        </tr>
                    </thead>
                    <tbody id="preview-body"></tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script>
    let converted = [];
    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get('mode') || 'traewelling';

    if (mode === 'travelynx') {
        document.getElementById('source-name').textContent = 'travelynx.de';
        document.getElementById('mode-label').textContent = '/ travelynx-konverter';
        document.getElementById('mode-desc').textContent = 'Konvertiere deinen travelynx.de JSON-Export für dilaeit.';
    } else {
        document.getElementById('source-name').textContent = 'Träwelling';
        document.getElementById('mode-label').textContent = '/ träwelling-konverter';
        document.getElementById('mode-desc').textContent = 'Konvertiere deinen Träwelling JSON-Export für dilaeit.';
    }

    document.getElementById('file-input').onchange = e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
            try {
                const raw = reader.result;
                converted = mode === 'travelynx' ? convertTravelynx(raw) : convertTraewelling(raw);
                render(converted);
            } catch(err) { alert('Fehler bei der Konvertierung: ' + err.message); }
        };
        reader.readAsText(file);
    };

    function convertTraewelling(raw) {
        const parsed = JSON.parse(raw);
        const data = parsed.data || parsed;
        if (!Array.isArray(data)) throw new Error('Kein gültiger Träwelling Export (Array erwartet)');
        
        return data.map(entry => {
            const s = entry.status;
            const ci = s.checkin;
            const depISO = ci.manualDeparture || ci.origin.departurePlanned;
            const arrISO = ci.manualArrival   || ci.destination.arrivalPlanned;
            const arrRealISO = ci.destination.arrivalReal  || arrISO;

            return {
                id: 'trw-' + s.id,
                date: new Date(depISO).toISOString().slice(0,10),
                time: new Date(depISO).toLocaleTimeString('de-DE', {hour:'2-digit',minute:'2-digit'}),
                line: ci.lineName || ci.number || '?',
                from: ci.origin.name,
                to: ci.destination.name,
                mode: (ci.category || 'train').toLowerCase(),
                km: ci.distance ? Math.round(ci.distance / 100) / 10 : null,
                delay: Math.round((new Date(arrRealISO) - new Date(arrISO)) / 60000),
                note: s.body || null,
                fromCoords: ci.origin.latitude ? [ci.origin.latitude, ci.origin.longitude] : null,
                toCoords: ci.destination.latitude ? [ci.destination.latitude, ci.destination.longitude] : null
            };
        });
    }

    function convertTravelynx(raw) {
        const data = JSON.parse(raw);
        if (!Array.isArray(data)) throw new Error('Kein gültiger Travelynx Export (Array erwartet)');
        
        return data.map(j => {
            const schedDep = parseFloat(j.sched_dep_ts) * 1000;
            const schedArr = parseFloat(j.sched_arr_ts) * 1000;
            const rtArr    = parseFloat(j.rt_arr_ts)    * 1000;
            
            let delay = 0;
            if (j.delay_arr != null) delay = Math.round(parseFloat(j.delay_arr) / 60);
            else if (rtArr && schedArr) delay = Math.round((rtArr - schedArr) / 60000);

            return {
                id: 'tlx-' + j.id,
                date: new Date(schedDep).toISOString().slice(0,10),
                time: new Date(schedDep).toLocaleTimeString('de-DE', {hour:'2-digit',minute:'2-digit'}),
                line: (j.type + ' ' + (j.line || j.no || '')).trim(),
                from: j.from_name,
                to: j.to_name,
                mode: j.type?.toLowerCase().includes('bus') ? 'bus' : 'train',
                km: j.km ? parseFloat(j.km) : null,
                delay: delay,
                fromCoords: j.from_latlon,
                toCoords: j.to_latlon,
                note: j.user_data?.comment || null
            };
        });
    }

    function render(data) {
        let totalKm = 0;
        data.forEach(j => { if(j.km) totalKm += j.km; });

        // ─── Statistiken berechnen ────────────────────────────────────────────
        // Kategorisierung nach Modus
        const catMap = {
            local:       { label: 'Nahverkehr (Bus/Bahn)', modes: ['bus','tram','subway','metro','ferry','regional'], color: 'text-blue-400' },
            regional:    { label: 'Regionalzug',            modes: ['regional-train','regio','rail'],                  color: 'text-green-400' },
            longdist:    { label: 'Fernverkehr',            modes: ['national','national-express','high-speed','ic','ice','longdistance','long-distance'], color: 'text-red-400' },
        };
        const classify = m => {
            const ml = (m||'').toLowerCase();
            if (catMap.longdist.modes.some(x => ml.includes(x))) return 'longdist';
            if (catMap.regional.modes.some(x => ml.includes(x))) return 'regional';
            return 'local';
        };

        // Pünktlichkeit je Kategorie
        const stats = { local: [], regional: [], longdist: [] };
        data.forEach(j => { if (j.delay !== null && j.delay !== undefined) stats[classify(j.mode)].push(j.delay); });

        const punctuality = cat => {
            const arr = stats[cat]; if (!arr.length) return null;
            const onTime = arr.filter(d => d <= 5).length;
            const avg = arr.reduce((a,b)=>a+b,0)/arr.length;
            return { total: arr.length, onTime, pct: Math.round(onTime/arr.length*100), avg: avg.toFixed(1) };
        };

        // Weiteste / kürzeste Strecke
        const withKm = data.filter(j => j.km > 0);
        const farthest = withKm.length ? withKm.reduce((a,b) => a.km>b.km?a:b) : null;
        const shortest = withKm.length ? withKm.reduce((a,b) => a.km<b.km?a:b) : null;

        // Meist gefahrene Linie
        const lineCounts = {};
        data.forEach(j => { lineCounts[j.line] = (lineCounts[j.line]||0)+1; });
        const topLines = Object.entries(lineCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);

        // Meist gefahrene Strecke
        const routeCounts = {};
        data.forEach(j => { const k=`${j.from}→${j.to}`; routeCounts[k]=(routeCounts[k]||0)+1; });
        const topRoutes = Object.entries(routeCounts).sort((a,b)=>b[1]-a[1]).slice(0,3);

        // Längster Streak (aufeinanderfolgende pünktliche Tage)
        let maxStreak=0, curStreak=0;
        [...data].sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(j=>{
            if((j.delay||0)<=5){curStreak++;maxStreak=Math.max(maxStreak,curStreak);}else curStreak=0;
        });

        // Durchschnittliche Verspätung gesamt
        const allDelays = data.filter(j=>j.delay!==null&&j.delay!==undefined).map(j=>j.delay);
        const avgDelay = allDelays.length ? (allDelays.reduce((a,b)=>a+b,0)/allDelays.length).toFixed(1) : '—';
        const onTimePct = allDelays.length ? Math.round(allDelays.filter(d=>d<=5).length/allDelays.length*100) : '—';

        // Pünktlichkeits-Badges
        const pctColor = p => p>=90?'text-green-400':p>=75?'text-yellow-400':'text-red-400';
        const catHtml = ['local','regional','longdist'].map(cat => {
            const s = punctuality(cat); if (!s) return '';
            const c = catMap[cat];
            return `<div class="scard">
                <div class="text-xs text-zinc-500 uppercase mb-2">${c.label}</div>
                <div class="flex items-end gap-3">
                    <div><div class="text-2xl font-black mono ${pctColor(s.pct)}">${s.pct}%</div><div class="text-[10px] text-zinc-500">pünktlich (≤5 min)</div></div>
                    <div class="text-right ml-auto"><div class="text-sm font-bold mono text-zinc-300">∅ +${s.avg}'</div><div class="text-[10px] text-zinc-500">${s.total} Fahrten</div></div>
                </div>
            </div>`;
        }).join('');

        document.getElementById('stat-row').innerHTML = `
            <div class="scard"><div class="text-2xl font-black text-white mono">${data.length}</div><div class="text-[10px] text-zinc-500 uppercase mt-1">Fahrten</div></div>
            <div class="scard"><div class="text-2xl font-black text-blue-400 mono">${Math.round(totalKm).toLocaleString('de-DE')}</div><div class="text-[10px] text-zinc-500 uppercase mt-1">km gesamt</div></div>
            <div class="scard"><div class="text-2xl font-black mono ${pctColor(Number(onTimePct))}">${onTimePct}%</div><div class="text-[10px] text-zinc-500 uppercase mt-1">gesamt pünktlich</div></div>
            <div class="scard"><div class="text-2xl font-black mono text-yellow-400">∅ +${avgDelay}'</div><div class="text-[10px] text-zinc-500 uppercase mt-1">Ø Verspätung</div></div>
        `;

        // Statistik-Abschnitt einfügen
        let statsSection = document.getElementById('stats-section');
        if (!statsSection) {
            statsSection = document.createElement('div');
            statsSection.id = 'stats-section';
            document.getElementById('result-section').insertAdjacentElement('afterbegin', statsSection);
        }
        statsSection.className = 'space-y-4 mb-6';
        statsSection.innerHTML = `
            <div class="text-xs font-bold uppercase tracking-wider text-zinc-500 mb-2">Pünktlichkeit nach Kategorie</div>
            <div class="grid grid-cols-1 gap-3">${catHtml}</div>

            <div class="text-xs font-bold uppercase tracking-wider text-zinc-500 mt-4 mb-2">Highlights</div>
            <div class="grid grid-cols-1 gap-3">
                ${farthest ? `<div class="scard"><div class="text-xs text-zinc-500 uppercase mb-1">Weiteste Fahrt</div><div class="font-bold text-white">${farthest.line} · ${farthest.from} → ${farthest.to}</div><div class="text-sm font-black text-blue-400 mono mt-1">${farthest.km} km · ${farthest.date}</div></div>` : ''}
                ${shortest ? `<div class="scard"><div class="text-xs text-zinc-500 uppercase mb-1">Kürzeste Fahrt</div><div class="font-bold text-white">${shortest.line} · ${shortest.from} → ${shortest.to}</div><div class="text-sm font-black text-blue-400 mono mt-1">${shortest.km} km · ${shortest.date}</div></div>` : ''}
                <div class="scard"><div class="text-xs text-zinc-500 uppercase mb-1">Längster Pünktlichkeits-Streak</div><div class="text-2xl font-black text-green-400 mono">${maxStreak}</div><div class="text-[10px] text-zinc-500">aufeinanderfolgende pünktliche Fahrten</div></div>
            </div>

            <div class="text-xs font-bold uppercase tracking-wider text-zinc-500 mt-4 mb-2">Top 5 Linien</div>
            <div class="scard space-y-2">
                ${topLines.map(([line, cnt], i) => `
                    <div class="flex items-center gap-3">
                        <span class="text-zinc-600 mono text-sm w-5">${i+1}.</span>
                        <span class="px-2 py-0.5 rounded bg-red-600 text-white font-black italic text-xs">${line}</span>
                        <div class="flex-1 bg-zinc-800 rounded-full h-1.5">
                            <div class="bg-red-500 h-1.5 rounded-full" style="width:${Math.round(cnt/topLines[0][1]*100)}%"></div>
                        </div>
                        <span class="text-zinc-400 text-xs mono">${cnt}×</span>
                    </div>`).join('')}
            </div>

            <div class="text-xs font-bold uppercase tracking-wider text-zinc-500 mt-4 mb-2">Top 3 Strecken</div>
            <div class="scard space-y-2">
                ${topRoutes.map(([route, cnt], i) => `
                    <div class="flex items-center justify-between gap-3">
                        <span class="text-zinc-600 mono text-sm shrink-0">${i+1}.</span>
                        <span class="text-xs text-white flex-1">${route}</span>
                        <span class="text-zinc-400 text-xs mono shrink-0">${cnt}×</span>
                    </div>`).join('')}
            </div>
        `;

        document.getElementById('preview-body').innerHTML = data.slice(0, 100).map(j => `
            <tr>
                <td class="text-zinc-500 mono">${j.date}</td>
                <td class="text-zinc-400 mono">${j.time}</td>
                <td class="font-bold">${j.line}</td>
                <td class="text-zinc-400 text-xs">${j.from}</td>
                <td class="text-zinc-400 text-xs">${j.to}</td>
                <td class="text-zinc-500 mono">${j.km || '—'}</td>
                <td class="${j.delay > 0 ? 'text-red-400' : 'text-green-400'} font-bold mono">${j.delay > 0 ? '+' : ''}${j.delay}'</td>
            </tr>
        `).join('');

        document.getElementById('preview-hint').textContent = data.length > 100 ? `Vorschau: Erste 100 von ${data.length} Fahrten` : `${data.length} Fahrten bereit zum Download.`;
        document.getElementById('result-section').classList.remove('hidden');
    }

    function startDownload() {
        const blob = new Blob([JSON.stringify(converted, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `dilaeit_import_${mode}_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
    }
</script>
</body>
</html>
